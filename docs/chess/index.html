<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a1f">
<style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Саванна и Океан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow column — opponent bar, board, your bar, status and two actions. The board itself is the thesis: sand at the savanna's end fades into sea at the ocean's end. */
:root {
  --bg: #e9f1ee;
  --surface: #ffffff;
  --ink: #13262b;
  --ink-dim: #557077;
  --line: rgba(19, 38, 43, 0.12);
  --sand: #e9c98c;
  --sand-deep: #c98f2e;
  --sea: #79c3d3;
  --sea-deep: #1d5f93;
  --coral: #e2603f;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1a1f; --surface: #14272e; --ink: #e6f1ef; --ink-dim: #8eabb0; --line: rgba(230, 241, 239, 0.12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1a1f; --surface: #14272e; --ink: #e6f1ef; --ink-dim: #8eabb0; --line: rgba(230, 241, 239, 0.12);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

.app { max-width: 620px; margin: 0 auto; padding-block: 12px 24px; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; text-wrap: balance; }
h1 .amp { color: var(--coral); }
.tools { display: flex; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; font-size: 17px;
}
.icon-btn[aria-pressed="true"] { opacity: 0.55; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.team { display: flex; align-items: center; gap: 10px; min-width: 0; }
.crest { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--emoji); font-size: 22px; flex: none; }
.crest.w { background: radial-gradient(circle at 35% 30%, #ffe8b3, var(--sand-deep)); box-shadow: inset 0 0 0 2px #8a5a12; }
.crest.b { background: radial-gradient(circle at 35% 30%, #5aa0d6, #123a62); box-shadow: inset 0 0 0 2px #0b2240; }
.team-name { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.team-name b { font-weight: 800; }
.team-name span { font-size: 12px; color: var(--ink-dim); }
.bar.turn .team-name b::after { content: " · ходит"; color: var(--coral); font-weight: 600; }
.tray { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0; font-family: var(--emoji); font-size: 16px; line-height: 1; min-width: 0; max-width: 60%; }
.tray span { margin-left: -3px; filter: saturate(0.8); }

.board-wrap { display: flex; justify-content: center; }
.board {
  --cell: 40px;
  position: relative;
  width: min(100%, 600px, calc(100vh - 290px));
  width: min(100%, 600px, calc(100dvh - 290px));
  min-width: 260px;
  aspect-ratio: 1;
  border-radius: 14px;
  overflow: hidden;
  background: linear-gradient(to bottom, var(--sea) 0%, #a9d6cf 46%, #d9d2a4 56%, var(--sand) 100%);
  box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08), 0 14px 40px rgba(10, 40, 50, 0.22);
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
.board.flipped { background: linear-gradient(to top, var(--sea) 0%, #a9d6cf 46%, #d9d2a4 56%, var(--sand) 100%); }
.board.shake { animation: shake 0.35s ease-out; }
@keyframes shake { 20% { transform: translateY(3px); } 40% { transform: translateY(-2px); } 60% { transform: translateY(1px); } }
.squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
.sq { position: relative; cursor: pointer; }
.sq.dark { background: rgba(14, 52, 62, 0.17); }
.sq.last { background-color: rgba(255, 226, 110, 0.42); }
.sq.sel { background-color: rgba(255, 255, 255, 0.55); }
.sq.dot::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 26%; height: 26%; transform: translate(-50%, -50%);
  border-radius: 50%; background: rgba(15, 45, 50, 0.32);
}
.sq.cap::after {
  content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 4px solid rgba(226, 96, 63, 0.75);
}
.sq.check { background: radial-gradient(circle, rgba(226, 70, 50, 0.7), rgba(226, 70, 50, 0) 72%); }
.coord { position: absolute; font-size: 10px; font-weight: 800; color: rgba(15, 45, 50, 0.5); pointer-events: none; }
.coord.f { right: 4px; bottom: 2px; }
.coord.r { left: 4px; top: 2px; }

.pieces, .fx { position: absolute; inset: 0; pointer-events: none; }
.pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; will-change: transform; }
.pc.moving { z-index: 5; }
.pc::before {
  content: ""; position: absolute; inset: 14%; border-radius: 50%;
  transition: opacity 0.4s, transform 0.4s;
}
.pc.team-w::before { background: radial-gradient(circle at 35% 30%, #fff0c8, #dca34a 70%); box-shadow: inset 0 0 0 2px #8a5a12, 0 3px 6px rgba(80, 50, 10, 0.3); }
.pc.team-b::before { background: radial-gradient(circle at 35% 30%, #5aa0d6, #123a62 72%); box-shadow: inset 0 0 0 2px #071c33, 0 3px 6px rgba(5, 25, 45, 0.4); }
.pc.die-land::before, .pc.die-sea::before { opacity: 0; transform: scale(0.4); }
.face { position: absolute; inset: 0; display: grid; place-items: center; transition: transform 0.18s; }
.face.flip { transform: scaleX(-1); }
.idle { display: grid; place-items: center; width: 100%; height: 100%; }
.glyph { font-family: var(--emoji); font-size: calc(var(--cell) * 0.6); line-height: 1; filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.25)); }

/* idle behaviour, one per animal */
.i-wk .idle { animation: breathe 2.6s ease-in-out infinite; }
.i-wq .idle { animation: prowl 2.2s ease-in-out infinite; }
.i-wr .idle { animation: snort 3.4s ease-in-out infinite; }
.i-wb .idle { animation: sway 3s ease-in-out infinite; transform-origin: 50% 80%; }
.i-wn .idle { animation: nod 2.8s ease-in-out infinite; }
.i-wp .idle { animation: bounce 1.3s ease-in-out infinite; }
.i-bk .idle { animation: float 3.6s ease-in-out infinite; }
.i-bq .idle { animation: patrol 2.4s ease-in-out infinite; }
.i-br .idle { animation: tnod 4.2s ease-in-out infinite; }
.i-bb .idle { animation: pinch 2.6s ease-in-out infinite; }
.i-bn .idle { animation: porpoise 2s ease-in-out infinite; }
.i-bp .idle { animation: fishswim 1.5s ease-in-out infinite; }
.pc.sel .idle { animation: excite 0.6s ease-in-out infinite; }
.pc.check .idle { animation: panic 0.45s ease-in-out infinite; }
.pc.moving .idle { animation: none; }
.pc.die-land .idle { animation: poof 0.55s ease-in forwards; }
.pc.die-sea .idle { animation: sink 0.75s ease-in forwards; }

@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes prowl { 0%, 100% { transform: translateX(-5%); } 50% { transform: translateX(5%); } }
@keyframes snort { 0%, 78%, 100% { transform: rotate(0); } 84% { transform: rotate(-8deg) translateX(-3%); } 90% { transform: rotate(6deg); } 95% { transform: rotate(-3deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes nod { 0%, 66%, 100% { transform: rotate(0); } 76% { transform: rotate(-10deg) translateY(-5%); } 86% { transform: rotate(7deg); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-12%); } 55% { transform: translateY(0) scale(1.05, 0.95); } }
@keyframes float { 0%, 100% { transform: translateY(4%); } 50% { transform: translateY(-6%); } }
@keyframes patrol { 0%, 100% { transform: translateX(-6%) rotate(-4deg); } 50% { transform: translateX(6%) rotate(4deg); } }
@keyframes tnod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4%) rotate(-4deg); } }
@keyframes pinch { 0%, 58%, 100% { transform: rotate(0); } 64% { transform: rotate(-12deg); } 70% { transform: rotate(12deg); } 76% { transform: rotate(-10deg); } 82% { transform: rotate(8deg); } 88% { transform: rotate(0); } }
@keyframes porpoise { 0%, 100% { transform: translateY(3%) rotate(8deg); } 50% { transform: translateY(-9%) rotate(-12deg); } }
@keyframes fishswim { 0%, 100% { transform: translateX(-4%) rotate(-7deg); } 50% { transform: translateX(4%) rotate(7deg); } }
@keyframes excite { 0%, 100% { transform: translateY(0) scale(1.12); } 50% { transform: translateY(-14%) scale(1.2); } }
@keyframes panic { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7%) rotate(-5deg); } 75% { transform: translateX(7%) rotate(5deg); } }
@keyframes poof { 30% { transform: scale(1.25) rotate(-20deg); } 100% { transform: scale(0) rotate(240deg); opacity: 0; } }
@keyframes sink { 100% { transform: translateY(70%) scale(0.45) rotate(25deg); opacity: 0; } }

.fx-p { position: absolute; border-radius: 50%; pointer-events: none; }
.say {
  position: absolute; z-index: 8; transform: translate(-50%, -100%);
  background: var(--surface); color: var(--ink); font-family: var(--display); font-size: 12px; font-weight: 700;
  padding: 5px 9px; border-radius: 12px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  animation: sayit 1.8s ease-out forwards;
}
@keyframes sayit { 0% { opacity: 0; margin-top: 6px; } 12% { opacity: 1; margin-top: 0; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: -8px; } }

.status { margin: 0; text-align: center; font-family: var(--display); font-weight: 500; font-size: 15px; min-height: 1.4em; text-wrap: balance; }
.status.alert { color: var(--coral); }
.lastmove { margin: -4px 0 0; text-align: center; font-size: 13px; color: var(--ink-dim); min-height: 1.3em; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 14px;
  font-weight: 800; cursor: pointer;
}
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--coral); border-color: transparent; color: #fff; }

.modal {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: rgba(6, 20, 26, 0.55);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  overflow-y: auto;
}
.card {
  width: min(100%, 460px); background: var(--surface); border-radius: 20px; padding: 22px 18px 18px;
  display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  animation: rise 0.3s ease-out both; max-height: 100%; overflow-y: auto;
}
@keyframes rise { from { transform: translateY(12px); opacity: 0.5; } to { transform: none; opacity: 1; } }
.card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.15; text-wrap: balance; }
.card p { margin: 0; line-height: 1.45; }
.eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--coral); font-weight: 800; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12px; font-weight: 800; color: var(--ink-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg); }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); color: var(--coral); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.legend h3 { margin: 0 0 6px; font-family: var(--display); font-size: 13px; font-weight: 700; }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.legend li { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: center; font-size: 13px; line-height: 1.2; }
.legend .em { font-family: var(--emoji); font-size: 22px; text-align: center; }
.legend small { display: block; color: var(--ink-dim); font-size: 11px; }
.legend-full li { grid-template-columns: 34px 1fr; align-items: start; }
.legend-full .why { color: var(--ink-dim); font-size: 12px; }
.promo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.promo-grid button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 10px 4px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
}
.promo-grid .em { font-family: var(--emoji); font-size: 30px; }

@media (max-width: 380px) { .legend { grid-template-columns: 1fr; } h1 { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) {
  .idle { animation: none !important; }
  .card { animation: none; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>Саванна <span class="amp">и</span> Океан</h1>
    <div class="tools">
      <button class="icon-btn" id="btn-legend" type="button" aria-label="Кто есть кто">📖</button>
      <button class="icon-btn" id="btn-sound" type="button" aria-label="Звук" aria-pressed="false">🔊</button>
    </div>
  </header>

  <div class="bar" id="bar-top">
    <div class="team"><span class="crest" id="crest-top"></span><span class="team-name"><b id="name-top"></b><span id="sub-top"></span></span></div>
    <div class="tray" id="tray-top" aria-label="Съеденные фигуры"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="squares" id="squares"></div>
      <div class="pieces" id="pieces"></div>
      <div class="fx" id="fx"></div>
    </div>
  </div>

  <div class="bar" id="bar-bot">
    <div class="team"><span class="crest" id="crest-bot"></span><span class="team-name"><b id="name-bot"></b><span id="sub-bot"></span></span></div>
    <div class="tray" id="tray-bot" aria-label="Съеденные фигуры"></div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
  <p class="lastmove" id="lastmove"></p>
  <div class="actions">
    <button class="btn" id="btn-undo" type="button">↶ Отменить ход</button>
    <button class="btn primary" id="btn-new" type="button">Новая партия</button>
  </div>
</div>

<div class="modal" id="m-menu">
  <section class="card">
    <span class="eyebrow">Шахматы, где фигуры живые</span>
    <h2>Саванна против Океана</h2>
    <p>Правила обычных шахмат. Белые — звери саванны, чёрные — жители океана.</p>
    <div class="legend" id="legend-short"></div>
    <div class="field"><span>Соперник</span>
      <div class="seg" id="seg-mode">
        <button type="button" data-v="ai">Компьютер</button>
        <button type="button" data-v="duo">Вдвоём</button>
      </div>
    </div>
    <div class="field" id="f-side"><span>Вы играете за</span>
      <div class="seg" id="seg-side">
        <button type="button" data-v="w">🦁 Саванну</button>
        <button type="button" data-v="b">🐋 Океан</button>
      </div>
    </div>
    <div class="field" id="f-level"><span>Сила компьютера</span>
      <div class="seg" id="seg-level">
        <button type="button" data-v="1">Детёныш</button>
        <button type="button" data-v="2">Охотник</button>
        <button type="button" data-v="3">Вожак</button>
      </div>
    </div>
    <div class="row2" id="menu-actions">
      <button class="btn" id="btn-continue" type="button">Продолжить</button>
      <button class="btn primary" id="btn-start" type="button">Начать</button>
    </div>
  </section>
</div>

<div class="modal" id="m-legend" hidden>
  <section class="card">
    <span class="eyebrow">Кто есть кто</span>
    <h2>Звери и их ходы</h2>
    <div class="legend legend-full" id="legend-full"></div>
    <button class="btn primary" id="btn-legend-close" type="button">Понятно</button>
  </section>
</div>

<div class="modal" id="m-promo" hidden>
  <section class="card">
    <span class="eyebrow">Превращение</span>
    <h2 id="promo-title">Кем стать?</h2>
    <div class="promo-grid" id="promo-grid"></div>
  </section>
</div>

<div class="modal" id="m-end" hidden>
  <section class="card">
    <span class="eyebrow" id="end-eyebrow">Партия окончена</span>
    <h2 id="end-title"></h2>
    <p id="end-text"></p>
    <div class="row2">
      <button class="btn" id="btn-look" type="button">К доске</button>
      <button class="btn primary" id="btn-again" type="button">Ещё партию</button>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------- who is who ----------------
  const SP = {
    w: {
      name: 'Саванна', gen: 'саванны', crest: '🦁',
      k: { e: '🦁', n: 'Лев', mv: 'king', say: 'Р-р-р!', why: 'Царь зверей. Шагает на одну клетку в любую сторону.' },
      q: { e: '🐆', n: 'Леопард', mv: 'dash', why: 'Самый ловкий хищник: бьёт в любую сторону и на любое расстояние.' },
      r: { e: '🦏', n: 'Носорог', mv: 'charge', why: 'Несётся напролом, но только по прямой.' },
      b: { e: '🐘', n: 'Слон', mv: 'stomp', why: 'Фигура и так зовётся «слон». Ходит по диагонали, земля дрожит.' },
      n: { e: '🦓', n: 'Зебра', mv: 'leap', why: 'Полосатая лошадь: прыгает буквой «Г» через кого угодно.' },
      p: { e: '🐒', n: 'Мартышка', mv: 'hop', why: 'Их много. Скачут вперёд, а дойдя до края, становятся кем захотят.' },
    },
    b: {
      name: 'Океан', gen: 'океана', crest: '🐋',
      k: { e: '🐋', n: 'Кит', mv: 'glide', say: 'У-у-у!', why: 'Самый большой и неторопливый житель моря. Плывёт на одну клетку.' },
      q: { e: '🦈', n: 'Акула', mv: 'lunge', why: 'Гроза океана: бросается в любую сторону на любое расстояние.' },
      r: { e: '🐢', n: 'Черепаха', mv: 'crawl', why: 'Панцирь-крепость. Плывёт только прямо.' },
      b: { e: '🦀', n: 'Краб', mv: 'scuttle', why: 'Ходит боком, то есть наискосок — по диагонали.' },
      n: { e: '🐬', n: 'Дельфин', mv: 'dive', why: 'Выпрыгивает из воды и перелетает через фигуры буквой «Г».' },
      p: { e: '🐠', n: 'Рыбка', mv: 'swim', why: 'Стайка мальков. Доплыв до края, вырастает в кого угодно.' },
    },
  };
  const ROLE = { k: 'Король', q: 'Ферзь', r: 'Ладья', b: 'Слон', n: 'Конь', p: 'Пешка' };
  const ORDER = ['k', 'q', 'r', 'b', 'n', 'p'];
  const FILES = 'abcdefgh';
  const sqName = (i) => FILES[i & 7] + (8 - (i >> 3));
  const other = (c) => (c === 'w' ? 'b' : 'w');

  // ---------------- engine ----------------
  const D = {

  function kingSq(b, c) { for (let i = 0; i < 64; i++) { const p = b[i]; if (p && p.c === c && p.t === 'k') return i; } return -1; }

  function pseudo(s) {

      } else if (p.t === 'n' || p.t === 'k') {

          const t = rr * 8 + cc;
          if (!b[t] || b[t].c === op) mv.push({ from: i, to: t });
        }

            if (s.cr[me + 'Q'] && rq && rq.t === 'r' && rq.c === me && !b[row + 1] && !b[row + 2] && !b[row + 3] && !attacked(b, row + 3, op) && !attacked(b, row + 2, op))
              mv.push({ from: i, to: row + 2, castle: 'Q' });

        }
      } else {
        for (const [dr, dc] of D[p.t]) {

            if (b[t]) { if (b[t].c === op) mv.push({ from: i, to: t }); break; }
            mv.push({ from: i, to: t });

  }

  function make(s, m) {
    const n = clone(s), b = n.b, p = b[m.from], cap = b[m.to];
    b[m.to] = p; b[m.from] = null;
    if (m.ep) b[m.to + (p.c === 'w' ? 8 : -8)] = null;
    if (m.promo) b[m.to] = { t: m.promo, c: p.c, id: p.id };
    if (m.castle) {

      else { b[row + 3] = b[row]; b[row] = null; }
    }
    n.ep = m.dbl ? (m.from + m.to) / 2 : -1;
    if (p.t === 'k') { n.cr[p.c + 'K'] = false; n.cr[p.c + 'Q'] = false; }
    for (const sq of [m.from, m.to]) {

      if (sq === 56) n.cr.wQ = false;
      if (sq === 7) n.cr.bK = false;
      if (sq === 0) n.cr.bQ = false;

  function legal(s) {

  function evaluate(b) {
    let sc = 0;

      const p = b[i];

    const nx = -dy / len, ny = dx / len;
    const at = (a, ox = 0, oy = 0, extra = '') => T(f.x + dx * a + ox, f.y + dy * a + oy, extra);
    const K = (list) => list.map(([o, tr]) => ({ offset: o, transform: tr }));
    switch (style) {
      case 'hop': return { dur: 380, ease: 'ease-out', k: K([[0, at(0)], [0.45, at(0.5, 0, -0.35, 'scale(1.12)')], [0.8, at(1, 0, 0, 'scale(1.08,0.9)')], [1, at(1)]]) };
      case 'leap': return { dur: 580, ease: 'ease-in-out', k: K([[0, at(0)], [0.15, at(0, 0, 0.05, 'scale(1.1,0.85)')], [0.5, at(0.5, 0, -1.0, 'scale(1.35) rotate(-14deg)')], [0.85, at(1, 0, 0, 'scale(1.1,0.88)')], [1, at(1)]]) };
      case 'stomp': {
        const n = Math.max(2, Math.round(len * 1.5)), k = [[0, at(0)]];
        for (let i = 1; i <= n; i++) { k.push([(i - 0.5) / n, at((i - 0.5) / n, 0, -0.12, 'rotate(-4deg)')]); k.push([i / n, at(i / n, 0, 0, 'rotate(3deg)')]); }
        k[k.length - 1] = [1, at(1)];
        return { dur: 380 + n * 140, ease: 'linear', k: K(k) };
      }
      case 'charge': return { dur: 460, ease: 'ease-in', k: K([[0, at(0)], [0.25, at(-0.06, 0, 0, 'rotate(-8deg) scale(1.05)')], [0.85, at(1.05, 0, 0, 'rotate(6deg)')], [1, at(1)]]) };
      case 'dash': return { dur: 340, ease: 'ease-in-out', k: K([[0, at(0)], [0.2, at(0, 0, 0, 'scale(0.9,1.1)')], [0.6, at(0.7, 0, 0, 'scale(1.35,0.8)')], [1, at(1)]]) };
      case 'king': return { dur: 560, ease: 'ease-in-out', k: K([[0, at(0)], [0.25, at(0.35, 0, -0.2, 'scale(1.1)')], [0.5, at(0.55)], [0.75, at(0.85, 0, -0.18, 'scale(1.1)')], [1, at(1)]]) };
      case 'glide': return { dur: 820, ease: 'ease-in-out', k: K([[0, at(0)], [0.5, at(0.5, 0, -0.08, 'rotate(4deg) scale(1.06)')], [1, at(1)]]) };
      case 'lunge': return { dur: 400, ease: 'cubic-bezier(.5,0,.3,1)', k: K([[0, at(0)], [0.28, at(-0.08, 0, 0, 'scale(0.92)')], [0.8, at(1.08, 0, 0, 'scale(1.2) rotate(-6deg)')], [1, at(1)]]) };
      case 'crawl': return { dur: 520 + len * 180, ease: 'ease-in-out', k: K([[0, at(0)], [0.25, at(0.25, 0, -0.04, 'rotate(-4deg)')], [0.5, at(0.5)], [0.75, at(0.75, 0, -0.04, 'rotate(4deg)')], [1, at(1)]]) };
      case 'scuttle': {
        const k = [];
        for (let i = 0; i <= 6; i++) k.push([i / 6, at(i / 6, 0, 0, i === 0 || i === 6 ? '' : `rotate(${i % 2 ? 14 : -14}deg)`)]);
        return { dur: 380 + len * 110, ease: 'linear', k: K(k) };
      }
      case 'swim': {
        const k = [];
        for (let i = 0; i <= 4; i++) { const w = Math.sin((i / 4) * Math.PI * 2) * 0.12; k.push([i / 4, at(i / 4, nx * w, ny * w, i % 4 ? `rotate(${w > 0 ? 10 : -10}deg)` : '')]); }
        return { dur: 480, ease: 'ease-in-out', k: K(k) };
      }
      case 'dive': return { dur: 640, ease: 'ease-in-out', k: K([[0, at(0)], [0.2, at(0.05, 0, 0.08, 'scale(0.9)')], [0.5, at(0.5, 0, -1.15, 'scale(1.35) rotate(-28deg)')], [0.82, at(1, 0, 0.05, 'scale(0.95) rotate(20deg)')], [1, at(1)]]) };
      default: return { dur: 300, ease: 'ease-in-out', k: K([[0, at(0)], [1, at(1)]]) };
    }
  }

  function play(el, style, f, t) {
    return new Promise((res) => {
      const fr = frames(style, f, t);
      const dur = reduce ? 160 : fr.dur;
      if (t.x !== f.x) el.querySelector('.face').classList.toggle('flip', t.x > f.x);
      el.classList.add('moving');
      const a = el.animate(fr.k, { duration: dur, easing: fr.ease, fill: 'forwards' });
      const done = () => { el.style.transform = T(t.x, t.y); a.cancel(); el.classList.remove('moving'); res(dur); };
      a.onfinish = done;
      a.oncancel = null;
    });
  }

  function landFx(style, t, c) {
    if (reduce) return;
    if (style === 'stomp') { boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake'); dust(t, 9, true); }
    else if (style === 'charge' || style === 'leap' || style === 'dash') dust(t, 7);
    else if (style === 'dive') splash(t);
    else if (style === 'glide') spout(t);
    else if (c === 'b') bubbles(t, 3, 0.5);
    else dust(t, 4);
  }

  function kill(victim, sqi) {
    const el = els.get(victim.id);
    if (!el) return;
    const d = disp(sqi);
    el.classList.add(victim.c === 'w' ? 'die-land' : 'die-sea');
    if (!reduce) victim.c === 'w' ? dust(d, 10, true) : bubbles(d, 9, 1.1);
    SFX.capture(victim.c);
    els.delete(victim.id);
    setTimeout(() => el.remove(), 800);
  }

  function describe(s, m) {
    const p = s.b[m.from], sp = SP[p.c][p.t];
    if (m.castle) return `Рокировка: ${sp.n} и ${SP[p.c].r.n} ${m.castle === 'K' ? '(короткая)' : '(длинная)'}`;
    const victim = m.ep ? s.b[m.to + (p.c === 'w' ? 8 : -8)] : s.b[m.to];
    let txt = `${sp.n} ${sqName(m.from)} ${victim ? '✕' : '→'} ${sqName(m.to)}`;
    if (victim) txt += ` · съедает: ${SP[victim.c][victim.t].n}`;
    if (m.promo) txt += ` · становится: ${SP[p.c][m.promo].n}`;
    return txt;
  }

  async function doMove(m) {
    busy = true;
    sel = -1; selMoves = [];
    const before = S, after = make(S, m);
    const p = before.b[m.from];
    const sp = SP[p.c][p.t];
    G.log.push(describe(before, m));
    paintSquares();
    $('btn-undo').disabled = true;

    const victim = m.ep ? before.b[m.to + (p.c === 'w' ? 8 : -8)] : before.b[m.to];
    const vsq = m.ep ? m.to + (p.c === 'w' ? 8 : -8) : m.to;
    const el = els.get(p.id);
    SFX.move(p.c);
    const fr = frames(sp.mv, disp(m.from), disp(m.to));
    if (victim) setTimeout(() => kill(victim, vsq), (reduce ? 160 : fr.dur) * 0.72);
    const jobs = [play(el, sp.mv, disp(m.from), disp(m.to))];
    if (m.castle) {
      const row = m.from - 4;
      const rf = m.castle === 'K' ? row + 7 : row, rt = m.castle === 'K' ? row + 5 : row + 3;
      const rook = before.b[rf];
      jobs.push(new Promise((r) => setTimeout(r, 160)).then(() => play(els.get(rook.id), SP[p.c].r.mv, disp(rf), disp(rt))));
    }
    await Promise.all(jobs);
    landFx(sp.mv, disp(m.to), p.c);

    G.hist.push(after);
    G.lastMove = G.lastMove || {};
    G.lastMove[G.hist.length - 1] = [m.from, m.to];
    S = after;
    moves = legal(S);
    checkEnd();
    if (m.promo && !reduce) { const d = disp(m.to); p.c === 'w' ? dust(d, 12, true) : bubbles(d, 10, 1); }
    render();
    if (!G.over && inCheck(S)) {
      const k = kingSq(S.b, S.turn);
      SFX.check(S.turn);
      say(k, SP[S.turn].k.say);
    }
    save();
    await new Promise((r) => setTimeout(r, victim ? 180 : 40));
    busy = false;
    paintBars();
    if (G.over) { setTimeout(showEnd, 650); return; }
    maybeAI();
  }

  function checkEnd() {
    if (!moves.length) {
      if (inCheck(S)) {
        const win = other(S.turn), lose = S.turn;
        G.over = {
          title: `Мат! Победа ${SP[win].gen}`,
          text: lose === 'b' ? 'Кит окружён со всех сторон, и океан сдаётся.' : 'Лев загнан в угол, и саванна признаёт поражение.',
          winner: win,
        };
      } else G.over = { title: 'Пат — ничья', text: `${SP[S.turn].k.n} не под ударом, но ходить больше некуда.` };
    } else if (S.half >= 100) G.over = { title: 'Ничья', text: '50 ходов подряд никого не съели и мартышки с рыбками не двигались.' };
    else if (insufficient(S.b)) G.over = { title: 'Ничья', text: 'Осталось слишком мало фигур, чтобы поставить мат.' };
  }

  function maybeAI() {
    if (!G || G.over || G.mode !== 'ai' || S.turn === G.side) return;
    busy = true;
    paintStatus();
    paintBars();
    setTimeout(() => {
      const m = pickMove(S, G.level);
      busy = false;
      if (m) doMove(m);
    }, 420);
  }

  // ---------------- input ----------------
  squaresEl.addEventListener('click', (e) => {
    const d = e.target.closest('.sq');
    if (!d) return;
    onSquare(+d.dataset.sq);
  });

  function onSquare(i) {
    if (busy || !isHumanTurn()) return;
    ac();
    const p = S.b[i];
    if (sel >= 0) {
      const ms = selMoves.filter((m) => m.to === i);
      if (ms.length) {
        if (ms[0].promo) askPromo(S.turn).then((t) => doMove(ms.find((m) => m.promo === t)));
        else doMove(ms[0]);
        return;
      }
    }
    if (p && p.c === S.turn && sel !== i) {
      sel = i;
      selMoves = moves.filter((m) => m.from === i);
      SFX.pick(p.c);
      paintSquares();
      if (!selMoves.length) paintStatus(`${SP[p.c][p.t].n} сейчас не может ходить`);
      else paintStatus();
      return;
    }
    sel = -1; selMoves = [];
    paintSquares();
    paintStatus();
  }

  function askPromo(c) {
    return new Promise((res) => {
      $('promo-title').textContent = `${SP[c].p.n} у края доски. Кем стать?`;
      const grid = $('promo-grid');
      grid.innerHTML = '';
      for (const t of ['q', 'r', 'b', 'n']) {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = `<span class="em">${SP[c][t].e}</span>${SP[c][t].n}`;
        b.addEventListener('click', () => { $('m-promo').hidden = true; res(t); });
        grid.appendChild(b);
      }
      $('m-promo').hidden = false;
      grid.querySelector('button').focus();
    });
  }

  $('btn-undo').addEventListener('click', () => {
    if (busy || !G || G.hist.length < 2) return;
    let n = 1;
    if (G.mode === 'ai') {
      // step back to the human's turn
      n = 0;
      let h = G.hist.length;
      do { h--; n++; } while (h > 0 && G.hist[h - 1].turn !== G.side);
      if (h < 1 && G.hist[0].turn !== G.side) return;
    }
    for (let k = 0; k < n && G.hist.length > 1; k++) { G.hist.pop(); G.log.pop(); }
    G.over = null;
    S = G.hist[G.hist.length - 1];
    moves = legal(S);
    sel = -1; selMoves = [];
    render();
    save();
  });

  // ---------------- menus ----------------
  function legendHTML(full) {
    return ['w', 'b'].map((c) => `
      <div><h3>${SP[c].crest} ${SP[c].name} · ${c === 'w' ? 'белые' : 'чёрные'}</h3><ul>
      ${ORDER.map((t) => `<li><span class="em">${SP[c][t].e}</span><span><b>${SP[c][t].n}</b><small>${ROLE[t]}</small>${full ? `<span class="why">${SP[c][t].why}</span>` : ''}</span></li>`).join('')}
      </ul></div>`).join('');
  }
  $('legend-short').innerHTML = legendHTML(false);
  $('legend-full').innerHTML = legendHTML(true);

  function bindSeg(id, key, cast) {
    const seg = $(id);
    const paint = () => seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(cast(b.dataset.v) === opts[key])));
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      opts[key] = cast(b.dataset.v); paint(); paintMenu();
    });
    paint();
  }
  function paintMenu() {
    $('f-side').hidden = opts.mode !== 'ai';
    $('f-level').hidden = opts.mode !== 'ai';
  }
  bindSeg('seg-mode', 'mode', String);
  bindSeg('seg-side', 'side', String);
  bindSeg('seg-level', 'level', Number);

  function openMenu() {
    const saved = G && !G.over && G.hist.length > 1;
    $('btn-continue').hidden = !saved;
    $('menu-actions').style.gridTemplateColumns = saved ? '1fr 1fr' : '1fr';
    paintMenu();
    $('m-menu').hidden = false;
  }

  function startGame() {
    ac();
    G = { mode: opts.mode, side: opts.side, level: opts.level, hist: [initState()], log: [], over: null, lastMove: {} };
    store.set('zoochess.opts', JSON.stringify(opts));
    S = G.hist[0];
    moves = legal(S);
    sel = -1; selMoves = [];
    els.forEach((el) => el.remove()); els.clear();
    buildSquares();
    $('m-menu').hidden = true;
    render();
    save();
    setTimeout(maybeAI, 300);
  }

  function resumeGame(g) {
    G = g;
    G.lastMove = G.lastMove || {};
    S = G.hist[G.hist.length - 1];
    moves = legal(S);
    els.forEach((el) => el.remove()); els.clear();
    buildSquares();
    render();
  }

  function showEnd() {
    SFX.end();
    $('end-title').textContent = G.over.title;
    $('end-text').textContent = G.over.text;
    $('end-eyebrow').textContent = G.mode === 'ai' && G.over.winner ? (G.over.winner === G.side ? 'Вы победили' : 'Компьютер победил') : 'Партия окончена';
    $('m-end').hidden = false;
  }

  $('btn-start').addEventListener('click', startGame);
  $('btn-continue').addEventListener('click', () => { $('m-menu').hidden = true; maybeAI(); });
  $('btn-new').addEventListener('click', () => { if (!busy) openMenu(); });
  $('btn-again').addEventListener('click', () => { $('m-end').hidden = true; openMenu(); });
  $('btn-look').addEventListener('click', () => { $('m-end').hidden = true; });
  $('btn-legend').addEventListener('click', () => { $('m-legend').hidden = false; $('btn-legend-close').focus(); });
  $('btn-legend-close').addEventListener('click', () => { $('m-legend').hidden = true; });
  $('btn-sound').addEventListener('click', () => { setMuted(!muted); if (!muted) SFX.pick('b'); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { $('m-legend').hidden = true; }
  });

  // cell size for emoji scaling
  const ro = new ResizeObserver(() => boardEl.style.setProperty('--cell', boardEl.clientWidth / 8 + 'px'));
  ro.observe(boardEl);

  // ambient life: bubbles from the sea, an occasional whale spout
  setInterval(() => {
    if (reduce || !S || busy || document.hidden) return;
    const sea = [];
    S.b.forEach((p, i) => { if (p && p.c === 'b') sea.push([p, i]); });
    if (!sea.length) return;
    const [p, i] = sea[Math.floor(Math.random() * sea.length)];
    if (p.t === 'k' && Math.random() < 0.5) spout(disp(i)); else bubbles(disp(i), 2, 0.6);
  }, 2200);

  // ---------------- boot ----------------
  try { const o = JSON.parse(store.get('zoochess.opts') || 'null'); if (o) Object.assign(opts, o); } catch (e) {}
  ['seg-mode', 'seg-side', 'seg-level'].forEach((id) => {
    const key = { 'seg-mode': 'mode', 'seg-side': 'side', 'seg-level': 'level' }[id];
    $(id).querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === String(opts[key]))));
  });
  const saved = loadSaved();
  if (saved) resumeGame(saved);
  else { G = { mode: opts.mode, side: opts.side, level: opts.level, hist: [initState()], log: [], over: null, lastMove: {} }; S = G.hist[0]; moves = legal(S); buildSquares(); render(); }
  openMenu();

  window.__zoo = { legal, make, initState, inCheck, pickMove, perft: function perft(s, d) { if (!d) return 1; let n = 0; for (const m of legal(s)) n += perft(make(s, m), d - 1); return n; } };
})();
</script>
</body>
</html>
