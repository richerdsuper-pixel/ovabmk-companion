*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:0 0 32px}
.band{background:#1E40AF;color:#fff;padding:16px 16px 20px;border-bottom:4px solid var(--gold)}
.band h1{font-size:20px;font-weight:800}
.band p{opacity:.9;font-size:14px}
.langs{display:flex;gap:6px;margin-top:10px}
.langs button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:4px 10px;font-family:inherit;font-weight:600;font-size:13px}
.langs button.on{background:#fff;color:#1E40AF}
main{max-width:640px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.big{font-size:30px;font-weight:900;color:var(--head);line-height:1.1}
h2{font-size:17px;font-weight:800;color:var(--head)}
.mute{color:var(--mute)} .small{font-size:14px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
ul{padding-left:20px} li{margin:2px 0}
.vis{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.vis:first-of-type{border-top:0}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:13px;font-family:inherit;font-weight:800;font-size:16px;text-decoration:none;cursor:pointer}
.btn.call{background:var(--soft);color:var(--accent)}
.btn.danger{background:#B42318;color:#fff}
.btn.e103{background:#B42318;color:#fff;font-size:22px}
.signs{display:grid;grid-template-columns:1fr;gap:6px}
.signs label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600}
.signs input{width:22px;height:22px;accent-color:#B42318;flex:none}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px;font-weight:700}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px;font-weight:700}
.hidden{display:none}
</style>
</head>
